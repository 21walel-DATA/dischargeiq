# Applies database migrations to the PRODUCTION database. Manual only:
# GitHub -> Actions -> "Run migrations" -> "Run workflow". Uses the DATABASE_URL repository secret (D-020).
name: Run migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate
